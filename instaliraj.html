<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instaliraj Mob Trazilica</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a1628; color: #e8f0ff; text-align: center; padding: 24px; }
    img { max-width: min(90vw, 320px); background: #fff; padding: 12px; border-radius: 16px; }
    a { color: #5cff9a; font-size: 1.1rem; word-break: break-all; }
    ol { text-align: left; max-width: 420px; margin: 20px auto; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Skeniraj mobitelom</h1>
  <p id="urlLine"></p>
  <p><img id="qr" alt="QR kod" /></p>
  <ol>
    <li>Otvori link u <strong>Safari</strong> (iPhone) ili <strong>Chrome</strong> (Android).</li>
    <li>iPhone: Share → <strong>Dodaj na početni zaslon</strong>.</li>
    <li>Android: ⋮ → <strong>Instaliraj aplikaciju</strong> ili „Dodaj na početni zaslon”.</li>
    <li>Dozvoli lokaciju i kompas kad app traži.</li>
  </ol>
  <p><a id="open" href="./index.html">Otvori app</a></p>
  <script>
    const base = location.href.replace(/instaliraj\.html.*$/, "index.html");
    const u = new URL(base);
    document.getElementById("urlLine").textContent = u.href;
    document.getElementById("open").href = u.href;
    document.getElementById("qr").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=" + encodeURIComponent(u.href);
  </script>
</body>
</html>
