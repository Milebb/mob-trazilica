<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Trazilica" />
  <meta name="theme-color" content="#0a1628" />
  <title>Mob Trazilica</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="setup" class="screen">
    <h1>Mob Trazilica</h1>
    <p class="hint">Oba mobitela upišu isti kod. Ili pošalji link pa se kod upiše sam.</p>
    <label for="roomInput">Zajednički kod</label>
    <input id="roomInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="npr. mili-ana" />
    <label for="nameInput">Tvoje ime</label>
    <input id="nameInput" type="text" autocomplete="nickname" maxlength="20" placeholder="npr. Mili" />
    <button id="joinBtn" type="button" class="primary">Kreni</button>
    <button type="button" class="secondary share-btn">Pošalji link</button>
  </div>

  <div id="main" class="screen hidden">
    <header class="top">
      <span id="peerName">Tražim…</span>
      <span id="statusDot" class="dot"></span>
    </header>

    <div id="vertBlock" class="vert">
      <div id="vertIcon" class="vert-icon"></div>
      <div id="vertText" class="vert-text"></div>
    </div>

    <div class="compass-wrap">
      <svg id="arrow" class="arrow idle" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 4 L84 92 L50 72 L16 92 Z" />
      </svg>
    </div>

    <p id="distLine" class="dist"></p>
    <p id="infoLine" class="info"></p>

    <div class="actions">
      <button id="compassBtn" type="button" class="secondary hidden">Uključi kompas</button>
      <button type="button" class="secondary share-btn">Pošalji link</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
